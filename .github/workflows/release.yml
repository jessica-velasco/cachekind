name: Publish alpha

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed version tag to publish
        required: true
        default: v0.1.0-alpha.0
      operation:
        description: Release operation
        required: true
        type: choice
        default: publish-alpha
        options:
          - publish-alpha
          - remove-latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.operation == 'publish-alpha' && startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          test "${RELEASE_TAG#v}" = "$(node -p "require('./package.json').version")"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm publish --tag alpha --access public --provenance=false

  remove-latest:
    if: inputs.operation == 'remove-latest'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.2.0
      - run: npm dist-tag rm cachekind latest
